map $http_x_forwarded_proto $consulens_scheme {
    default $scheme;
    https https;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json;
    resolver 127.0.0.11 valid=15s ipv6=off;

    location ^~ /api/ {
        set $backend consulens-api:8000;
        proxy_pass http://$backend$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $consulens_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-store" always;
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }
    location ~ ^/(?:sw\.js|index\.html|pwa-version)$ {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }
    location ~ ^/(?:_expo/static|assets)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.[a-z0-9]+$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }
}
