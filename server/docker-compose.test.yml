# Fallback test database for environments where testcontainers cannot start containers.
#   docker compose -f docker-compose.test.yml up -d
#   TEST_DATABASE_URL=postgresql+asyncpg://test:test@127.0.0.1:55432/consulens_test pytest
# (use 127.0.0.1, not localhost: on Windows "localhost" tries ::1 first, ~2 s per connection)
#   docker compose -f docker-compose.test.yml down
name: consulens-test

services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: consulens_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d consulens_test"]
      interval: 2s
      timeout: 3s
      retries: 30
